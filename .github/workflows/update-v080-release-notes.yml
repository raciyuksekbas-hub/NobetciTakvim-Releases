name: update-v080-release-notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-v080-release-notes.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update v0.8.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.8.0 \
            --repo raciyuksekbas-hub/NobetciTakvim-Releases \
            --notes-file .github/release-notes-v080.md
