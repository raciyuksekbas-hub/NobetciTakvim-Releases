name: upload-windows-v080

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upload-windows-v080.yml

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-1078-8243-8c7e-c6db9b4d5097/raw?se=2026-10-12T12%3A54%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=053a4c42-f95e-532d-83b3-b9fb35a18cc0&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A14%3A59Z&ske=2026-10-13T01%3A14%3A59Z&sks=b&skv=2026-02-06&sig=BoquaN%2BA2piuSRXq2PxziVoC%2BuCNhdMkOv/fUDGizGI%3D"
      EXPECTED_SHA256: "ef8bb4d3fc4bcc48bd3a3292d2f7bc392bdb555f41699074bca789987177708b"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download accepted Windows artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o windows.zip
          mkdir out
          unzip -q windows.zip -d out
          ls -lh out

      - name: Verify installer checksum
        run: |
          actual="$(sha256sum out/NobetciTakvim.Setup.0.8.0.exe | awk '{print $1}')"
          echo "actual=$actual"
          test "$actual" = "$EXPECTED_SHA256"
          grep -F "$EXPECTED_SHA256  NobetciTakvim.Setup.0.8.0.exe" out/NobetciTakvim.Setup.0.8.0.exe.sha256

      - name: Ensure Windows assets do not already exist
        run: |
          assets="$(gh release view v0.8.0 --repo raciyuksekbas-hub/NobetciTakvim-Releases --json assets --jq '.assets[].name')"
          if echo "$assets" | grep -Fxq 'NobetciTakvim.Setup.0.8.0.exe'; then
            echo "Windows installer already exists; refusing to overwrite."
            exit 1
          fi

      - name: Upload Windows assets to existing v0.8.0 release
        run: |
          gh release upload v0.8.0             out/NobetciTakvim.Setup.0.8.0.exe             out/NobetciTakvim.Setup.0.8.0.exe.sha256             --repo raciyuksekbas-hub/NobetciTakvim-Releases

      - name: Update release notes for Windows
        run: |
          cat > release-notes.md <<'EOF'
          # NöbetçiTakvim 0.8.0

          Bu sürüm sadeleştirme ve güvenilirlik sürümüdür. Güncelleme verilerinizi değiştirmez.

          - Hedef Gün arayüzden kaldırıldı; önceki veriler korunur.
          - Anasayfa'ya Klasik / Görsel İş Öncelik Matrisi seçimi eklendi.
          - Uygulama gün değişiminde kendini otomatik olarak yeni güne günceller.
          - Toplantı hatırlatma arayüzü gerçek davranışla uyumlu hale getirildi.
          - Google Takvim senkronizasyonunda yeniden açma ve gereksiz yeniden gönderim davranışları düzeltildi.
          - UYAP'tan içe aktarılan taraf bilgileri artık Google Takvim açıklamalarına gönderilmez.

          **macOS:** `NobetciTakvim-0.8.0-arm64.dmg` — Apple Silicon, Developer ID ile imzalı ve Apple tarafından onaylanmış (notarized).

          SHA-256: `ddc378ee8d41a5e4aaaf889b7628874e104684c99c83d85c8e70ddd8749259e8`

          **Windows:** `NobetciTakvim.Setup.0.8.0.exe` — Windows x64 NSIS installer.

          SHA-256: `ef8bb4d3fc4bcc48bd3a3292d2f7bc392bdb555f41699074bca789987177708b`
          EOF
          gh release edit v0.8.0             --repo raciyuksekbas-hub/NobetciTakvim-Releases             --notes-file release-notes.md
