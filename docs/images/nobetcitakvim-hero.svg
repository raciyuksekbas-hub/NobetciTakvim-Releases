<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NöbetçiTakvim — Her iş, vaktinde.</title>
  <desc id="desc">NöbetçiTakvim için koyu grafit ve petrol tonlarında ürün tanıtım görseli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111417"/>
      <stop offset="1" stop-color="#1A2228"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A7F8E"/>
      <stop offset="1" stop-color="#1E5F6A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="1090" cy="84" r="150" fill="#2A7F8E" opacity="0.08"/>
  <circle cx="980" cy="350" r="220" fill="#D4D7DB" opacity="0.03"/>

  <g transform="translate(78 83)" filter="url(#shadow)">
    <rect x="0" y="0" width="182" height="182" rx="38" fill="#151B1F" stroke="#2A7F8E" stroke-width="2"/>
    <path d="M43 57h96a13 13 0 0 1 13 13v76a13 13 0 0 1-13 13H43a13 13 0 0 1-13-13V70a13 13 0 0 1 13-13Z" fill="none" stroke="#D4D7DB" stroke-width="8"/>
    <path d="M55 39v35M127 39v35" stroke="#2A7F8E" stroke-width="9" stroke-linecap="round"/>
    <path d="M55 92h26l20 40 24-40h10" fill="none" stroke="#F3F4F2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(310 92)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="52" fill="#F3F4F2" font-size="58" font-weight="750" letter-spacing="-1.5">NöbetçiTakvim</text>
    <text x="0" y="98" fill="#9DA5AB" font-size="24" font-weight="500">Avukatlar için iş, duruşma ve hukuki süre takibi.</text>
    <text x="0" y="148" fill="#D4D7DB" font-size="28" font-style="italic" font-weight="550">Her iş, vaktinde.</text>

    <g transform="translate(0 194)" font-size="17" font-weight="650">
      <rect x="0" y="0" width="158" height="42" rx="21" fill="url(#accent)"/>
      <text x="79" y="27" text-anchor="middle" fill="#F3F4F2">macOS + Windows</text>

      <rect x="174" y="0" width="124" height="42" rx="21" fill="#20272C" stroke="#39454C"/>
      <text x="236" y="27" text-anchor="middle" fill="#D4D7DB">Local-first</text>

      <rect x="314" y="0" width="104" height="42" rx="21" fill="#20272C" stroke="#39454C"/>
      <text x="366" y="27" text-anchor="middle" fill="#D4D7DB">Ücretsiz</text>

      <rect x="434" y="0" width="168" height="42" rx="21" fill="#20272C" stroke="#39454C"/>
      <text x="518" y="27" text-anchor="middle" fill="#D4D7DB">UYAP ile uyumlu</text>
    </g>
  </g>

  <g transform="translate(310 338)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="0" fill="#7F8A91" font-size="15" font-weight="600" letter-spacing="1.6">YÜKSEKBAŞ LEGALTECH</text>
  </g>
</svg>
